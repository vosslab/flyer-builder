</svg><svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 240 240" role="img" aria-labelledby="pac-title pac-description" x="211" y="26">
  <title id="pacpac-title">Pac, a delighted molecular passenger</title>
  <desc id="pacpac-description">Orange Pac raises its two phenyl-ring hands on a bent left side chain, looks down toward its partner with lifted eyebrows and a pleased smile, and balances on the same benzoate and acetate feet. Its six-eight-six taxane core and oxetane hip remain intact.</desc>
  
