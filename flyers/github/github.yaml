title: Voss Lab on GitHub
page: {margin: 28}
styles:
  body: {size: 11, leading: 13.5, color: "#24354B"}
  eyebrow: {size: 12, leading: 15, bold: true, color: "#00775F"}
  title: {size: 38, leading: 40, bold: true, color: "#182B49"}
  deck: {size: 15, leading: 18, color: "#314A68"}
  section: {size: 15, leading: 18, bold: true, color: "#182B49"}
  project: {size: 11.5, leading: 14, bold: true, color: "#00775F"}
  footer: {size: 9, leading: 11, color: "#51667E", align: center}
layout:
  col:
    gap: 23
    items:
      - row:
          gap: 14
          items:
            - weight: 1
              block: {image: {path: assets/profile.png, height: 90}}
            - weight: 3
              block:
                col:
                  gap: 4
                  items:
                    - text: {value: "OPEN PROJECTS FOR LEARNING, RESEARCH, AND MAKING", style: eyebrow}
                    - text: {value: "Voss Lab\non GitHub", style: title}
                    - text: {value: "Practical, open tools for students, instructors, researchers, and curious makers.", style: deck}
            - weight: 1
              block: {qr: {url: "https://github.com/vosslab", size: 126, color: "#182B49", icon: assets/github_octocat.svg, label: "SCAN TO EXPLORE"}}
      - rule: {color: "#00775F", thickness: 2}
      - image: {path: assets/contribution_graph.png, height: 123}
      - text: {value: "Pinned projects", style: section}
      - row:
          gap: 16
          items:
            - weight: 1
              block:
                col:
                  gap: 4
                  items:
                    - text: {value: "Education and assessment", style: eyebrow, color: "#00775F"}
                    - text: {value: "biology-problems", style: project, color: "#007A00"}
                    - text: {value: "Randomized biology questions for homework, quizzes, and LMS exports."}
            - weight: 1
              block:
                col:
                  gap: 4
                  items:
                    - text: {value: "Research, games, and AI workflows", style: eyebrow, color: "#935D00"}
                    - text: {value: "vossvolvox-pages", style: project, color: "#00775F"}
                    - text: {value: "Measure protein and RNA volume, channels, solvent, and exit tunnels in your browser."}
      - row:
          gap: 16
          items:
            - weight: 1
              block:
                col:
                  gap: 4
                  items:
                    - text: {value: "qti-package-maker-rs", style: project, color: "#076DAD"}
                    - text: {value: "One editable question bank becomes LMS packages, practice quizzes, and review copies."}
            - weight: 1
              block:
                col:
                  gap: 4
                  items:
                    - text: {value: "bad-cell-day", style: project, color: "#935D00"}
                    - text: {value: "A cooperative puzzle game about two molecular heroes navigating a living tumor."}
      - row:
          gap: 16
          items:
            - weight: 1
              block:
                col:
                  gap: 4
                  items:
                    - text: {value: "concept-map-maker", style: project, color: "#A719DB"}
                    - text: {value: "Build rubric-checked concept maps in a browser, then export them as SVG, PNG, or data."}
            - weight: 1
              block:
                col:
                  gap: 4
                  items:
                    - text: {value: "vosslab-skills", style: project, color: "#C80085"}
                    - text: {value: "Reusable agent skills for planning, review, maintenance, and education content."}
      - rule: {color: "#00775F", thickness: 2}
      - text: {value: "Find source code, documentation, and new experiments at github.com/vosslab", style: footer}
